name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Stamp Version From Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # v1.2.0 -> 1.2.0.0 (the in-app updater compares this with the latest release tag)
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Tag '$tag' must look like v1.2.3" }
          $v3 = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $v4 = "$v3.0"
          $info = "src\ClassroomChecker\Properties\AssemblyInfo.cs"
          $text = Get-Content $info -Raw -Encoding utf8
          $text = $text -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$v4`")"
          $text = $text -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$v4`")"
          $text = $text -replace 'AssemblyInformationalVersion\("[^"]*"\)', "AssemblyInformationalVersion(`"$v3`")"
          Set-Content $info $text -Encoding utf8 -NoNewline
          $man = "src\ClassroomChecker\app.manifest"
          (Get-Content $man -Raw -Encoding utf8) -replace 'assemblyIdentity version="[^"]*"', "assemblyIdentity version=`"$v4`"" | Set-Content $man -Encoding utf8 -NoNewline
          Write-Host "Version stamped: $v4"

      - name: Build Solution (Release x64)
        run: |
          msbuild ClassroomChecker.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild

      - name: Run Unit Tests
        run: |
          cmd /c tests\run_tests.bat

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          New-Item -ItemType Directory -Force -Path .\release-artifacts
          New-Item -ItemType Directory -Force -Path .\portable-pack\installers
          New-Item -ItemType Directory -Force -Path .\portable-pack\fonts
          New-Item -ItemType Directory -Force -Path .\portable-pack\specs
          New-Item -ItemType Directory -Force -Path .\portable-pack\reports

          # Copy files into portable pack
          Copy-Item "src\ClassroomChecker\bin\Release\ClassroomChecker.exe" -Destination ".\portable-pack\"
          if (Test-Path "dist\config.json") { Copy-Item "dist\config.json" -Destination ".\portable-pack\" }
          if (Test-Path "src\ClassroomChecker\Assets\bg.png") { Copy-Item "src\ClassroomChecker\Assets\bg.png" -Destination ".\portable-pack\bg.png" }
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination ".\portable-pack\" }
          if (Test-Path "dist\installers\README.txt") { Copy-Item "dist\installers\README.txt" -Destination ".\portable-pack\installers\" }
          if (Test-Path "dist\fonts") { Copy-Item "dist\fonts\*" -Destination ".\portable-pack\fonts\" -Recurse }

          # Standalone executable
          Copy-Item "src\ClassroomChecker\bin\Release\ClassroomChecker.exe" -Destination ".\release-artifacts\ClassroomChecker.exe"

          # Zip package
          $zipPath = ".\release-artifacts\ClassroomChecker-$ver-Portable.zip"
          Compress-Archive -Path ".\portable-pack\*" -DestinationPath $zipPath

          # SHA-256 checksums, one "<hash>  <file name>" line per file (sha256sum format;
          # the in-app updater reads this to verify the downloaded exe)
          $lines = Get-FileHash -Algorithm SHA256 .\release-artifacts\ClassroomChecker.exe, $zipPath |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }
          [IO.File]::WriteAllLines("$PWD\release-artifacts\checksums-sha256.txt", [string[]]$lines)

      - name: Upload Build Artifacts (CI Archive)
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomChecker-Artifacts
          path: release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Classroom Checker ${{ github.ref_name }}"
          files: |
            release-artifacts/ClassroomChecker.exe
            release-artifacts/*.zip
            release-artifacts/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
