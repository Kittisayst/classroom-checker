name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (Release x64)
        run: |
          msbuild ClassroomChecker.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild

      - name: Run Unit Tests
        run: |
          cmd /c tests\run_tests.bat

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          New-Item -ItemType Directory -Force -Path .\release-artifacts
          New-Item -ItemType Directory -Force -Path .\portable-pack\installers
          New-Item -ItemType Directory -Force -Path .\portable-pack\specs
          New-Item -ItemType Directory -Force -Path .\portable-pack\reports

          # Copy files into portable pack
          Copy-Item "src\ClassroomChecker\bin\Release\ClassroomChecker.exe" -Destination ".\portable-pack\"
          Copy-Item "dist\config.json" -Destination ".\portable-pack\"
          Copy-Item "dist\bg.png" -Destination ".\portable-pack\"
          Copy-Item "README.md" -Destination ".\portable-pack\"
          Copy-Item "dist\installers\README.txt" -Destination ".\portable-pack\installers\"

          # Standalone executable
          Copy-Item "src\ClassroomChecker\bin\Release\ClassroomChecker.exe" -Destination ".\release-artifacts\ClassroomChecker.exe"

          # Zip package
          $zipPath = ".\release-artifacts\ClassroomChecker-$ver-Portable.zip"
          Compress-Archive -Path ".\portable-pack\*" -DestinationPath $zipPath

          # Generate SHA-256 Checksums
          Get-FileHash -Algorithm SHA256 .\release-artifacts\* | Out-File ".\release-artifacts\checksums-sha256.txt" -Encoding utf8

      - name: Upload Build Artifacts (CI Archive)
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomChecker-Artifacts
          path: release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Classroom Checker ${{ github.ref_name }}"
          files: |
            release-artifacts/ClassroomChecker.exe
            release-artifacts/*.zip
            release-artifacts/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
